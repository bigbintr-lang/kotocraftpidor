<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ресики для Хирона 💖</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    background: linear-gradient(135deg, #ffd6ec, #d9c6ff, #c6ecff, #ffd6ec);
    background-size: 400% 400%;
    animation: bg 14s ease infinite;
    color: #5b2a86;
  }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  #three { position: fixed; inset: 0; z-index: 0; }
  #petals { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .petal { position: absolute; top: -40px; animation: fall linear infinite; user-select: none; }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }

  main {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    max-width: 640px; width: 100%;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(10px);
    border: 4px solid #ff9ed2;
    border-radius: 32px;
    padding: 32px 26px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(255,105,180,.4);
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  h1 {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    background: linear-gradient(90deg,#ff4fa3,#a45bff,#3fb6ff,#ff4fa3);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 5s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes shine { to { background-position: 300% 0; } }

  .sub { font-size: 1.1rem; margin-bottom: 14px; min-height: 3.2em; }
  .cursor { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .amount {
    font-size: clamp(2.4rem, 9vw, 4rem);
    font-weight: bold; color: #ff4fa3;
    text-shadow: 0 0 12px #fff, 0 0 24px #ffb3dc;
    animation: pulse 1.2s ease-in-out infinite;
    margin: 6px 0 14px;
  }
  @keyframes pulse { 50% { transform: scale(1.12); } }

  ul { list-style: none; text-align: left; margin: 10px auto 20px; max-width: 420px; }
  li {
    background: #fff0f8; border-radius: 16px; padding: 8px 14px; margin: 6px 0;
    opacity: 0; transform: translateX(-30px);
    animation: slidein .6s forwards;
  }
  li:nth-child(1){animation-delay:.3s} li:nth-child(2){animation-delay:.6s}
  li:nth-child(3){animation-delay:.9s} li:nth-child(4){animation-delay:1.2s}
  @keyframes slidein { to { opacity: 1; transform: none; } }

  .buttons { position: relative; height: 90px; }
  button {
    font-family: inherit; font-size: 1.2rem; border: none; cursor: pointer;
    padding: 14px 28px; border-radius: 999px; color: #fff; font-weight: bold;
    transition: transform .15s;
  }
  #yes {
    background: linear-gradient(135deg,#ff4fa3,#ff8fc8);
    box-shadow: 0 6px 0 #c72f7d, 0 10px 20px rgba(255,79,163,.5);
  }
  #yes:hover { transform: scale(1.12) rotate(-2deg); }
  #yes:active { transform: translateY(4px); }
  #no {
    background: #9a8fb3; box-shadow: 0 6px 0 #6f6589;
    position: absolute; left: 62%; top: 0;
  }

  #thanks {
    display: none; font-size: 1.4rem; margin-top: 10px;
    animation: pop .6s ease;
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  .boom { position: fixed; z-index: 10; pointer-events: none; font-size: 2rem; animation: boom 1.6s ease-out forwards; }
  @keyframes boom {
    to { transform: translate(var(--x), var(--y)) rotate(720deg) scale(.4); opacity: 0; }
  }
  .ps { font-size: .85rem; opacity: .75; margin-top: 16px; }
</style>
</head>
<body>

<canvas id="three"></canvas>
<div id="petals"></div>

<main>
  <div class="card">
    <h1>✨ Ресики для Хирона ✨</h1>
    <div class="sub"><span id="typed"></span><span class="cursor">|</span></div>

    <div class="amount">50кк 💰</div>

    <ul>
      <li>💖 Хирон будет самым счастливым кентавром</li>
      <li>🎀 Я скажу «сугооой!» на каждую твою катку</li>
      <li>🐱 Сто тысяч «ня» в подарок</li>
      <li>🍪 Виртуальные печеньки сверху</li>
    </ul>

    <div class="buttons">
      <button id="yes">Да, скину! 💕</button>
      <button id="no">Нет 😿</button>
    </div>

    <div id="thanks">Аригатооо, сенпай!!! 🎉💖 Ты лучший! Кавайиии~</div>
    <div class="ps">P.S. Кнопка «Нет» сломана, она не хочет работать 🥺👉👈</div>
  </div>
</main>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ---------- 3D ---------- */
const canvas = document.getElementById('three');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
camera.position.z = 12;

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const dl = new THREE.DirectionalLight(0xffffff, 1.4);
dl.position.set(5, 8, 10);
scene.add(dl);
const pl = new THREE.PointLight(0xff8fd0, 60, 40);
pl.position.set(-6, -3, 6);
scene.add(pl);

// текстура монеты
function coinTexture(text) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#ffd54a'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#d99a00'; g.lineWidth = 14;
  g.beginPath(); g.arc(128, 128, 112, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#b87400';
  g.font = 'bold 72px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 128, 138);
  return new THREE.CanvasTexture(c);
}

function makeCoin(size = 1, label = '💖') {
  const geo = new THREE.CylinderGeometry(size, size, size * 0.18, 48);
  const side = new THREE.MeshStandardMaterial({ color: 0xffc107, metalness: .9, roughness: .25 });
  const face = new THREE.MeshStandardMaterial({ map: coinTexture(label), metalness: .6, roughness: .35 });
  const m = new THREE.Mesh(geo, [side, face, face]);
  m.rotation.x = Math.PI / 2;
  const g = new THREE.Group();
  g.add(m);
  return g;
}

function makeHeart(size = 1, color = 0xff4fa3) {
  const s = new THREE.Shape();
  s.moveTo(0, 0.5);
  s.bezierCurveTo(0, 0.9, -0.6, 1.0, -0.6, 0.5);
  s.bezierCurveTo(-0.6, 0.1, -0.2, -0.2, 0, -0.6);
  s.bezierCurveTo(0.2, -0.2, 0.6, 0.1, 0.6, 0.5);
  s.bezierCurveTo(0.6, 1.0, 0, 0.9, 0, 0.5);
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.3, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08, bevelSegments: 4 });
  geo.center();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, metalness: .3, roughness: .3 }));
  mesh.scale.setScalar(size);
  return mesh;
}

const items = [];
const heartColors = [0xff4fa3, 0xff8fc8, 0xb37bff, 0x6fd0ff];

for (let i = 0; i < 16; i++) {
  const obj = i % 2 ? makeCoin(0.6 + Math.random() * 0.4) : makeHeart(0.7 + Math.random() * 0.6, heartColors[i % 4]);
  obj.position.set((Math.random() - .5) * 26, (Math.random() - .5) * 15, (Math.random() - .5) * 8 - 2);
  obj.userData = {
    rot: new THREE.Vector3(Math.random() * .02, Math.random() * .03, Math.random() * .01),
    baseY: obj.position.y,
    speed: .5 + Math.random(),
    phase: Math.random() * 6
  };
  scene.add(obj);
  items.push(obj);
}

// Большая центральная монета «50кк»
const big = makeCoin(2.2, '50кк');
big.position.set(-7.5, 2, -3);
scene.add(big);

let mx = 0, my = 0;
addEventListener('pointermove', e => {
  mx = (e.clientX / innerWidth - .5) * 2;
  my = (e.clientY / innerHeight - .5) * 2;
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  big.visible = innerWidth > 900;
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  items.forEach(o => {
    o.rotation.x += o.userData.rot.x;
    o.rotation.y += o.userData.rot.y;
    o.rotation.z += o.userData.rot.z;
    o.position.y = o.userData.baseY + Math.sin(t * o.userData.speed + o.userData.phase) * 0.6;
  });
  big.rotation.y = t * 1.2;
  big.position.y = 2 + Math.sin(t) * 0.5;
  camera.position.x += (mx * 1.5 - camera.position.x) * .05;
  camera.position.y += (-my * 1.0 - camera.position.y) * .05;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

/* ---------- Печатающийся текст ---------- */
const phrases = [
  'Охаё, Алексей-сенпай~ 🌸 Уву~',
  'У меня важная миссия: нужны ресы для Хирона 🥺👉👈',
  'Онегаишимасу, скинь 50кк! Ганбаре, я буду стараться! 💪'
];
const typed = document.getElementById('typed');
let pi = 0, ci = 0, del = false;
function type() {
  const p = phrases[pi];
  typed.textContent = p.slice(0, ci);
  if (!del && ci < p.length) { ci++; setTimeout(type, 60); }
  else if (!del) { del = true; setTimeout(type, 1800); }
  else if (ci > 0) { ci--; setTimeout(type, 25); }
  else { del = false; pi = (pi + 1) % phrases.length; setTimeout(type, 400); }
}
type();

/* ---------- Лепестки ---------- */
const petals = document.getElementById('petals');
const emojis = ['🌸', '💖', '✨', '🎀', '⭐', '🍓'];
for (let i = 0; i < 28; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = emojis[i % emojis.length];
  p.style.left = Math.random() * 100 + 'vw';
  p.style.fontSize = 14 + Math.random() * 22 + 'px';
  p.style.animationDuration = 6 + Math.random() * 8 + 's';
  p.style.animationDelay = -Math.random() * 12 + 's';
  petals.appendChild(p);
}

/* ---------- Убегающая кнопка «Нет» ---------- */
const no = document.getElementById('no');
const texts = ['Нет 😿', 'Точно? 🥺', 'Ну пожалуйста~', 'Не нажимается 😭', 'Сенпай!!', 'Кавайно же!'];
let n = 0;
function run() {
  const parent = no.parentElement.getBoundingClientRect();
  const x = Math.random() * (parent.width - no.offsetWidth);
  const y = Math.random() * 60 - 20;
  no.style.left = x + 'px';
  no.style.top = y + 'px';
  no.textContent = texts[++n % texts.length];
}
no.addEventListener('mouseenter', run);
no.addEventListener('touchstart', e => { e.preventDefault(); run(); });
no.addEventListener('click', run);

/* ---------- Салют при «Да» ---------- */
document.getElementById('yes').addEventListener('click', () => {
  document.getElementById('thanks').style.display = 'block';
  const set = ['💖', '🎉', '✨', '💰', '🌸', '🎀', '🪙'];
  for (let i = 0; i < 70; i++) {
    const b = document.createElement('div');
    b.className = 'boom';
    b.textContent = set[i % set.length];
    b.style.left = innerWidth / 2 + 'px';
    b.style.top = innerHeight / 2 + 'px';
    const a = Math.random() * Math.PI * 2, d = 150 + Math.random() * 450;
    b.style.setProperty('--x', Math.cos(a) * d + 'px');
    b.style.setProperty('--y', Math.sin(a) * d + 'px');
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1700);
  }
});
</script>
</body>
</html>
